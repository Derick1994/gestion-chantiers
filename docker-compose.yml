services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: chantiers
      MARIADB_USER: chantiers
      MARIADB_PASSWORD: chantierspass
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npx prisma migrate deploy && npx prisma db seed && npx next dev -H 0.0.0.0"
    environment:
      DATABASE_URL: mysql://chantiers:chantierspass@db:3306/chantiers
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data:
  node_modules:
